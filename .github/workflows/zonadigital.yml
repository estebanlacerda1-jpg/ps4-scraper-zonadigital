name: ZonaDigitalMD - prueba de catálogo

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zonadigital-test
  cancel-in-progress: true

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt

      - name: Ejecutar prueba de ZonaDigital
        run: python -u zonadigital.py
